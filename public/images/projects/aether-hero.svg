<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e0c" />
      <stop offset="50%" stop-color="#121612" />
      <stop offset="100%" stop-color="#090a09" />
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d7ff3f" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#95cc1a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0c0e0c" stop-opacity="0" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(215, 255, 63, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#gridPattern)" />

  <!-- Architectural Nodes & Ambient Network -->
  <g opacity="0.6">
    <circle cx="200" cy="200" r="3" fill="#d7ff3f" />
    <circle cx="600" cy="150" r="4" fill="#d7ff3f" />
    <circle cx="1000" cy="250" r="3" fill="#d7ff3f" />
    <circle cx="450" cy="480" r="4" fill="#d7ff3f" />
    <circle cx="850" cy="420" r="3" fill="#d7ff3f" />
    <line x1="200" y1="200" x2="600" y2="150" stroke="rgba(215, 255, 63, 0.15)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="600" y1="150" x2="1000" y2="250" stroke="rgba(215, 255, 63, 0.15)" stroke-width="1" />
    <line x1="600" y1="150" x2="450" y2="480" stroke="rgba(215, 255, 63, 0.15)" stroke-width="1" />
    <line x1="1000" y1="250" x2="850" y2="420" stroke="rgba(215, 255, 63, 0.15)" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Main Interface Shell -->
  <rect x="150" y="90" width="900" height="510" rx="8" fill="#131513" stroke="#252b23" stroke-width="1.5" />
  
  <!-- Interface Header -->
  <rect x="150" y="90" width="900" height="48" rx="8" fill="#181c17" />
  <circle cx="180" cy="114" r="5" fill="#30382d" />
  <circle cx="200" cy="114" r="5" fill="#30382d" />
  <circle cx="220" cy="114" r="5" fill="#30382d" />
  <text x="260" y="118" fill="#77766f" font-family="monospace" font-size="11" letter-spacing="1">AETHER_REASONING_CORE_V2.4 // NODE_01_ACTIVE</text>
  <rect x="910" y="104" width="115" height="20" rx="3" fill="#242e20" stroke="#3c4c36" stroke-width="1" />
  <text x="922" y="118" fill="#d7ff3f" font-family="monospace" font-size="10" font-weight="bold">STATUS: RUNNING</text>

  <!-- Left Sidebar Navigation -->
  <rect x="150" y="138" width="220" height="462" fill="#151814" border-right="1px solid #252b23" />
  <text x="180" y="180" fill="#95cc1a" font-family="monospace" font-size="11" font-weight="bold">AGENT PIPELINES</text>
  <rect x="175" y="198" width="170" height="32" rx="4" fill="#20271d" />
  <text x="190" y="218" fill="#f4f3ef" font-family="sans-serif" font-size="12">Cognitive Routing</text>
  <rect x="175" y="240" width="170" height="32" rx="4" fill="transparent" />
  <text x="190" y="260" fill="#77766f" font-family="sans-serif" font-size="12">Semantic Memory Graph</text>
  <rect x="175" y="282" width="170" height="32" rx="4" fill="transparent" />
  <text x="190" y="302" fill="#77766f" font-family="sans-serif" font-size="12">Distributed Evaluator</text>

  <!-- Main Visualization Area -->
  <g transform="translate(410, 170)">
    <text x="0" y="20" fill="#f4f3ef" font-family="sans-serif" font-size="18" font-weight="600">Enterprise Cognitive Telemetry</text>
    <text x="0" y="42" fill="#77766f" font-family="monospace" font-size="11">Real-time multi-agent execution graphs across 14 enterprise data silos</text>

    <!-- Stat Cards -->
    <rect x="0" y="70" width="180" height="85" rx="6" fill="#1b2019" stroke="#2c3729" stroke-width="1" />
    <text x="20" y="100" fill="#d7ff3f" font-family="sans-serif" font-size="28" font-weight="bold">+340%</text>
    <text x="20" y="125" fill="#77766f" font-family="monospace" font-size="10" letter-spacing="1">PIPELINE VELOCITY</text>

    <rect x="200" y="70" width="180" height="85" rx="6" fill="#1b2019" stroke="#2c3729" stroke-width="1" />
    <text x="220" y="100" fill="#f4f3ef" font-family="sans-serif" font-size="28" font-weight="bold">180ms</text>
    <text x="220" y="125" fill="#77766f" font-family="monospace" font-size="10" letter-spacing="1">AVG LATENCY</text>

    <rect x="400" y="70" width="200" height="85" rx="6" fill="#1b2019" stroke="#2c3729" stroke-width="1" />
    <text x="420" y="100" fill="#d7ff3f" font-family="sans-serif" font-size="28" font-weight="bold">99.8%</text>
    <text x="420" y="125" fill="#77766f" font-family="monospace" font-size="10" letter-spacing="1">ACCURACY INDEX</text>

    <!-- Graph Visualizer Waveform -->
    <rect x="0" y="180" width="600" height="190" rx="6" fill="#171b15" stroke="#252d22" stroke-width="1" />
    <path d="M 20 320 Q 90 230 160 270 T 300 240 T 440 210 T 580 230" fill="none" stroke="url(#limeGlow)" stroke-width="3" />
    <path d="M 20 320 Q 90 230 160 270 T 300 240 T 440 210 T 580 230 L 580 350 L 20 350 Z" fill="url(#limeGlow)" opacity="0.1" />
    <circle cx="440" cy="210" r="5" fill="#d7ff3f" />
    <text x="450" y="205" fill="#d7ff3f" font-family="monospace" font-size="10">PEAK REASONING STREAM</text>
  </g>
</svg>
