        <text x="25" y="70" fill="#f4f3ef" font-family="sans-serif" font-size="20" font-weight="bold">10,000 USD → 158,420,000 IDR</text>
        <text x="25" y="95" fill="#d7ff3f" font-family="monospace" font-size="11">● ZERO SPREAD · INSTANT SETTLEMENT (2.1s)</text>
