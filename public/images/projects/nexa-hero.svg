      <text x="0" y="48" fill="#77766f" font-family="monospace" font-size="11">Processed across 38 global currency corridors</text>

      <g transform="translate(0, 75)">
        <rect width="360" height="75" rx="6" fill="#161a14" stroke="#273322" />
        <text x="25" y="38" fill="#d7ff3f" font-family="sans-serif" font-size="28" font-weight="bold">$1.2B+</text>
        <text x="25" y="58" fill="#77766f" font-family="monospace" font-size="10">PROCESSED TRANSACTION VOLUME</text>
      </g>

      <g transform="translate(0, 165)">
        <rect width="360" height="75" rx="6" fill="#161a14" stroke="#273322" />
        <text x="25" y="38" fill="#f4f3ef" font-family="sans-serif" font-size="28" font-weight="bold">4.9 ★</text>
        <text x="25" y="58" fill="#77766f" font-family="monospace" font-size="10">APP STORE RATING (42,000+ REVIEWS)</text>
