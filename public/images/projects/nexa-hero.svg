  </defs>

  <rect width="1200" height="675" fill="url(#bgNexa)" />

  <g transform="translate(150, 90)">
    <rect width="900" height="510" rx="8" fill="#121411" stroke="#22281e" stroke-width="1.5" />
    <rect width="900" height="48" rx="8" fill="#181c15" />
    <text x="30" y="30" fill="#77766f" font-family="monospace" font-size="11" letter-spacing="1">NEXA_GLOBAL_FINTECH_CORE // MULTI_CURRENCY_SETTLEMENT // E-KYC ACTIVE</text>
    
    <!-- Tactile Card Graphic -->
    <g transform="translate(60, 100)">
