      <g transform="translate(0, 255)">
        <rect width="360" height="75" rx="6" fill="#161a14" stroke="#273322" />
        <text x="25" y="38" fill="#d7ff3f" font-family="sans-serif" font-size="28" font-weight="bold">&lt; 3.5s</text>
        <text x="25" y="58" fill="#77766f" font-family="monospace" font-size="10">CROSS-BORDER CLEARING SPEED</text>
