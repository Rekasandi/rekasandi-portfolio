      <rect width="360" height="220" rx="14" fill="url(#cardGrad)" stroke="#3a4533" stroke-width="1.5" />
      <text x="30" y="50" fill="#d7ff3f" font-family="monospace" font-size="16" font-weight="bold">NEXA // BLACK</text>
      <rect x="30" y="85" width="45" height="32" rx="4" fill="#d7ff3f" opacity="0.8" />
      <text x="30" y="160" fill="#f4f3ef" font-family="monospace" font-size="16" letter-spacing="4">••••  ••••  ••••  8942</text>
