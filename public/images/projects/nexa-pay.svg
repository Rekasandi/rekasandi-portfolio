      <text x="11" y="21" fill="#d7ff3f" font-family="sans-serif" font-size="14">↙</text>
      <text x="44" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">SingaVentures PTE</text>
      <text x="44" y="28" fill="#666560" font-family="monospace" font-size="10">SGD FAST · 14s ago</text>
      <text x="250" y="20" fill="#d7ff3f" font-family="monospace" font-size="12" font-weight="600">+S$185,000</text>
