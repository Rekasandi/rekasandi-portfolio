    <text x="32" y="160" fill="#f4f3ef" font-family="monospace" font-size="18" letter-spacing="3">••••  ••••  ••••  9842</text>
    <text x="32" y="200" fill="#777670" font-family="monospace" font-size="11">VALID THRU</text>
    <text x="108" y="200" fill="#f4f3ef" font-family="monospace" font-size="12">09/29</text>
    <text x="260" y="200" fill="#d7ff3f" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="2">VISA</text>
