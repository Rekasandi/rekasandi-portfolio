  <!-- 3 Currency Balance Cards -->
  <g transform="translate(64, 210)">
    <!-- USD -->
    <rect x="0" y="0" width="340" height="130" rx="8" fill="#141412" stroke="#262624" />
    <text x="24" y="38" fill="#777670" font-family="monospace" font-size="12">USD ACCOUNT · 8492</text>
    <text x="24" y="82" fill="#f4f3ef" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">$1,428,950.80</text>
    <text x="24" y="108" fill="#d7ff3f" font-family="monospace" font-size="12">↑ +14.2% THIS MONTH</text>

    <!-- EUR -->
    <rect x="364" y="0" width="340" height="130" rx="8" fill="#141412" stroke="#262624" />
    <text x="388" y="38" fill="#777670" font-family="monospace" font-size="12">EUR ACCOUNT · 1042</text>
    <text x="388" y="82" fill="#f4f3ef" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">€894,320.00</text>
    <text x="388" y="108" fill="#888780" font-family="monospace" font-size="12">STABLE · SEPA READY</text>

