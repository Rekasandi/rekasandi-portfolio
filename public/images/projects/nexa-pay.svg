<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#141412" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1d" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d7ff3f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d7ff3f" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1600" height="72" fill="#11110f" stroke="#222220" stroke-width="1" />
  <circle cx="48" cy="36" r="14" fill="#d7ff3f" />
  <text x="74" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="1">NEXA PAY</text>
  <text x="175" y="42" fill="#666560" font-family="monospace" font-size="12" letter-spacing="2">/ TREASURY CORE</text>

  <!-- Nav Links -->
  <text x="400" y="42" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Overview</text>
  <text x="500" y="42" fill="#888780" font-family="-apple-system, sans-serif" font-size="14">Multi-Currency</text>
  <text x="640" y="42" fill="#888780" font-family="-apple-system, sans-serif" font-size="14">Cross-Border Wires</text>
  <text x="810" y="42" fill="#888780" font-family="-apple-system, sans-serif" font-size="14">Virtual Cards</text>

  <!-- Status Pill -->
  <rect x="1420" y="24" width="132" height="28" rx="14" fill="#1c1c1a" stroke="#2e2e2a" />
  <circle cx="1438" cy="38" r="4" fill="#d7ff3f" />
  <text x="1452" y="42" fill="#ffffff" font-family="monospace" font-size="11">SWIFT ACTIVE</text>

  <!-- Page Header -->
