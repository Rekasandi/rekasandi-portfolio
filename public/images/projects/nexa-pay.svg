  <!-- Virtual Black Titanium Metal Card -->
  <g transform="translate(1160, 210)">
    <rect x="0" y="0" width="376" height="230" rx="14" fill="url(#cardGrad)" stroke="#383834" stroke-width="1.5" />
    <text x="32" y="44" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1">NEXA TITANIUM</text>
