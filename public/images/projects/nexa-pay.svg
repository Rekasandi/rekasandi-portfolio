    <text x="240" y="440" fill="#666560" font-family="monospace" font-size="11">04:00</text>
    <text x="450" y="440" fill="#666560" font-family="monospace" font-size="11">08:00 (JAKARTA OPEN)</text>
    <text x="680" y="440" fill="#666560" font-family="monospace" font-size="11">12:00 (LONDON OPEN)</text>
    <text x="920" y="440" fill="#666560" font-family="monospace" font-size="11">16:00 (NY OPEN)</text>
