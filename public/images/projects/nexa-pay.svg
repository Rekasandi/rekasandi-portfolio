    <text x="752" y="38" fill="#777670" font-family="monospace" font-size="12">SGD TREASURY · 6610</text>
    <text x="752" y="82" fill="#f4f3ef" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">S$640,180.45</text>
    <text x="752" y="108" fill="#d7ff3f" font-family="monospace" font-size="12">INSTANT FAST NETWORK</text>
