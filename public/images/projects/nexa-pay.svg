    <line x1="24" y1="184" x2="352" y2="184" stroke="#1f1f1d" />

    <!-- Tx 3 -->
    <g transform="translate(24, 200)">
      <circle cx="16" cy="16" r="16" fill="#1c1c1a" />
      <text x="11" y="21" fill="#d7ff3f" font-family="sans-serif" font-size="14">↙</text>
      <text x="44" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Aether AI Inc</text>
      <text x="44" y="28" fill="#666560" font-family="monospace" font-size="10">USD ACH · 1m ago</text>
      <text x="250" y="20" fill="#d7ff3f" font-family="monospace" font-size="12" font-weight="600">+$250,000</text>
    </g>

    <line x1="24" y1="254" x2="352" y2="254" stroke="#1f1f1d" />

    <!-- Tx 4 -->
    <g transform="translate(24, 270)">
      <circle cx="16" cy="16" r="16" fill="#1c1c1a" />
      <text x="11" y="21" fill="#d7ff3f" font-family="sans-serif" font-size="14">↗</text>
      <text x="44" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">PT Nusantara Cloud</text>
      <text x="44" y="28" fill="#666560" font-family="monospace" font-size="10">IDR BI-FAST · 3m ago</text>
      <text x="240" y="20" fill="#f4f3ef" font-family="monospace" font-size="12" font-weight="600">-Rp 380.5M</text>
    </g>
