      <text x="11" y="21" fill="#d7ff3f" font-family="sans-serif" font-size="14">↗</text>
      <text x="44" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Zurich Tech AG</text>
      <text x="44" y="28" fill="#666560" font-family="monospace" font-size="10">EUR SEPA · 2s ago</text>
      <text x="260" y="20" fill="#f4f3ef" font-family="monospace" font-size="12" font-weight="600">-€42,000</text>
