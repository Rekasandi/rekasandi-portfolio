    <text x="32" y="78" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="600">Cross-Border Settlement Velocity: 1.2s avg</text>

    <!-- Grid lines -->
    <line x1="32" y1="130" x2="1036" y2="130" stroke="#1f1f1d" stroke-dasharray="4 4" />
    <line x1="32" y1="210" x2="1036" y2="210" stroke="#1f1f1d" stroke-dasharray="4 4" />
    <line x1="32" y1="290" x2="1036" y2="290" stroke="#1f1f1d" stroke-dasharray="4 4" />
    <line x1="32" y1="370" x2="1036" y2="370" stroke="#1f1f1d" stroke-dasharray="4 4" />

    <!-- Chart Path -->
    <path d="M 32 320 C 140 310, 220 230, 320 240 C 440 250, 520 160, 640 180 C 760 200, 850 120, 1036 140 L 1036 430 L 32 430 Z" fill="url(#chartGrad)" />
